name: Rhyme (fka PriorAuthNow)
description: 'Rhyme (formerly PriorAuthNow) is a healthcare technology company that eliminates
  prior authorization burden by automating the exchange between payers and providers. Its
  platform delivers touchless prior authorization, gold carding (removing auth requirements
  entirely through payer-provider collaboration), and a shared dashboard for tracking
  efficiency. Rhyme processes over four million prior authorizations annually and connects
  83 of the largest US health systems with 300+ payers. The company is backed by Insight
  Partners and was surfaced to the API Evangelist network as a VC-portfolio lead; it
  publishes no public developer or API surface as of this enrichment pass.'
